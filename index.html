<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Fișier de întrebări — trivia în limba română</title>
    <meta
      name="description"
      content="Nouă sute de întrebări verificate, în română, despre lume și despre noi. Zece pe rundă, trei niveluri de dificultate, zece categorii."
    />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="canonical" href="https://psticea.github.io/trivia/" />

    <!-- Tema se aplică înainte de prima pictură, ca să nu apară o clipire albă. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('trivia-ro:theme') || '"dark"');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:site_name" content="Fișier de întrebări" />
    <meta property="og:title" content="Fișier de întrebări — trivia în limba română" />
    <meta
      property="og:description"
      content="Nouă sute de întrebări verificate, în română, despre lume și despre noi. Zece pe rundă."
    />
    <meta property="og:url" content="https://psticea.github.io/trivia/" />
    <meta property="og:image" content="https://psticea.github.io/trivia/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fișier de întrebări — o fișă de catalog cu o întrebare de trivia" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fișier de întrebări — trivia în limba română" />
    <meta name="twitter:description" content="Nouă sute de întrebări verificate, în română. Zece pe rundă." />
    <meta name="twitter:image" content="https://psticea.github.io/trivia/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Acest joc are nevoie de JavaScript activat. Toate întrebările sunt livrate de pe acest site, fără servicii externe.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
